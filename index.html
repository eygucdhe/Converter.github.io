<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorBlock 粒子转换器 · Java particleex → 网易基岩版 /fx /fxn /fxc</title>
<style>
  :root{
    --bg:#15171c; --panel:#1e2128; --panel2:#242832; --border:#333947;
    --text:#e8eaf0; --dim:#8b93a5; --accent:#4f8cff; --green:#3ecf6f; --red:#ff5c6c; --warn:#ffc46b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Segoe UI","Microsoft YaHei",sans-serif;height:100vh;display:flex;overflow:hidden}
  #sidebar{width:520px;min-width:400px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh}
  #sidebar header{padding:12px 16px 8px;border-bottom:1px solid var(--border)}
  #sidebar header h1{font-size:15px;font-weight:600}
  #sidebar header p{font-size:11px;color:var(--dim);margin-top:2px;line-height:1.6}
  #editorWrap{padding:10px 16px 4px;flex:0 0 auto}
  #cmd{width:100%;height:130px;background:var(--panel2);border:1px solid var(--border);border-radius:8px;color:var(--text);
       font-family:Consolas,monospace;font-size:12.5px;line-height:1.55;padding:10px;resize:vertical;outline:none}
  #cmd:focus{border-color:var(--accent)}
  .row{display:flex;gap:8px;padding:6px 16px;flex-wrap:wrap}
  button{background:var(--panel2);border:1px solid var(--border);color:var(--text);border-radius:6px;
         padding:6px 12px;font-size:12px;cursor:pointer;transition:.15s}
  button:hover{border-color:var(--accent);color:#fff}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  #log{flex:0 0 auto;max-height:150px;overflow-y:auto;padding:6px 16px 10px;border-top:1px solid var(--border);font-size:11.5px;line-height:1.6}
  #log .ok{color:var(--green)} #log .err{color:var(--red)} #log .info{color:var(--dim)} #log .warn{color:var(--warn)}
  #stage{flex:1;position:relative;height:100vh;display:flex;flex-direction:column}
  #cvwrap{flex:1;position:relative;min-height:0}
  canvas{display:block;width:100%;height:100%}
  #hud{position:absolute;top:12px;left:14px;font-size:11px;color:var(--dim);background:rgba(20,22,28,.7);
       padding:8px 12px;border-radius:8px;border:1px solid var(--border);pointer-events:none;line-height:1.8}
  #hud b{color:var(--text)}
  #speedCtrl{position:absolute;bottom:12px;left:14px;background:rgba(20,22,28,.7);border:1px solid var(--border);
             border-radius:8px;padding:6px 12px;font-size:11px;color:var(--dim);display:flex;align-items:center;gap:8px}
  #results{flex:1;min-height:120px;overflow-y:auto;background:var(--panel);border-top:1px solid var(--border);padding:8px 14px}
  #results h3{font-size:12px;color:var(--dim);font-weight:500;margin:2px 0 6px}
  .card{background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;margin-bottom:8px}
  .card:hover{border-color:#3d4a63}
  .card .no{display:inline-block;min-width:18px;height:18px;background:var(--accent);color:#fff;border-radius:4px;
            font-size:11px;text-align:center;line-height:18px;font-weight:700;margin-right:6px}
  .card .mode{font-size:11px;color:var(--dim)}
  .outCmd{background:var(--field,#17191d);border:1px solid var(--border);border-radius:6px;
          color:#8fd3ff;font-family:Consolas,monospace;font-size:11.5px;line-height:1.6;
          padding:6px 54px 6px 8px;margin:6px 0;word-break:break-all;cursor:pointer;position:relative}
  .outCmd:hover{border-color:var(--accent)}
  .outCmd .cp{position:absolute;right:6px;top:5px;font-size:10px;color:var(--dim);font-family:"Segoe UI",sans-serif}
  .outCmd:hover .cp{color:var(--accent)}
  .pgrid{display:flex;flex-wrap:wrap;gap:5px 10px;margin-top:4px}
  .pf{display:flex;align-items:center;gap:4px;font-size:11px;color:var(--dim)}
  .pf input[type=text],.pf input[type=number]{width:58px;background:#17191d;border:1px solid var(--border);border-radius:4px;
      color:var(--text);font-size:11px;padding:3px 5px;outline:none;font-family:Consolas,monospace}
  .pf input:focus{border-color:var(--accent)}
  .pf input.wide{width:100%;font-family:Consolas,monospace}
  .pf .fw{flex:1 1 100%}
  .playRow{display:flex;flex-wrap:wrap;gap:5px 10px;align-items:center;margin-top:6px;padding-top:6px;border-top:1px dashed var(--border)}
  .playRow select{background:#17191d;border:1px solid var(--border);color:var(--text);border-radius:4px;font-size:11px;padding:3px}
  .tl{margin:4px 0 2px}
  .tlbar{position:relative;height:14px;background:#17191d;border:1px solid var(--border);border-radius:4px;overflow:hidden}
  .tlseg{position:absolute;top:0;height:100%;background:linear-gradient(90deg,#2f6fdb,#4f8cff);opacity:.85}
  .tlcur{position:absolute;top:0;width:2px;height:100%;background:var(--red)}
  .tlinfo{font-size:10px;color:var(--dim);margin-top:2px}
  #toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;
         padding:8px 20px;border-radius:20px;font-size:13px;opacity:0;transition:.3s;pointer-events:none;z-index:9}
  #toast.show{opacity:1}

  /* ===== 手机端适配 ===== */
  @media (max-width:760px){
    body{flex-direction:column}
    #stage{order:-1;height:40vh;flex:none}
    #sidebar{width:auto;min-width:0;height:auto;flex:1;min-height:0;overflow-y:auto;border-right:none;border-top:1px solid var(--border)}
    #cmd{height:100px}
    #log{max-height:110px}
    #results{flex:none;max-height:none;overflow:visible}
    #hud{font-size:10px;padding:6px 9px}
    #speedCtrl{bottom:8px;left:8px}
    .pf input[type=text],.pf input[type=number]{font-size:16px}
  }
  @media (max-width:760px) and (orientation:landscape){
    #stage{height:55vh}
  }
</style>
</head>
<body>
<div id="sidebar">
  <header>
    <h1>ColorBlock 粒子转换器</h1>
    <p>Java /particleex → 网易基岩版 /fx /fxn /fxc · 解析按 ExParticle 1.16.5 反编译逻辑还原<br>转换后每条指令下方可调参数；下方可编排执行顺序（等上一个播完再放下一个）</p>
  </header>

  <div id="editorWrap">
    <textarea id="cmd" spellcheck="false" placeholder="粘贴 Java 版 particleex 指令（支持多条，一行一条），写完自动转换&#10;&#10;示例:&#10;particleex polarparameter ring 1 0.6 0.2 1 0 0 0 0 6.28 &quot;s1,s2,dis=t,0,2&quot; 0.05 3 200&#10;particleex tickparameter heart 1 0.1 0.25 1 0 0 0 0 6.28 &quot;x,y=1.6*sin(t)^3,1.6*cos(t)-0.6*cos(2*t)-0.25*cos(3*t)-0.12*cos(4*t)&quot; 0.06 4 0 null"></textarea>
  </div>

  <div class="row">
    <button class="primary" id="btnRun">▶ 生成并转换</button>
    <button id="btnCopySeq">⧉ 复制执行排期</button>
  </div>

  <div id="results">
    <h3>转换结果（点击指令复制；下方参数可直接改，改完立即生效）</h3>
    <div id="outList"><div style="font-size:12px;color:var(--dim)">点完「生成并转换」，这里出现可复制的基岩版指令和参数面板</div></div>
  </div>

  <div id="log"></div>
</div>

<div id="stage">
  <div id="cvwrap">
    <canvas id="cv"></canvas>
    <div id="hud">
      <b>预览</b>：拖动旋转 · 滚轮缩放<br>
      粒子: <span id="pcount">0</span> · <span id="pmode">待转换</span>
    </div>
    <div id="speedCtrl">
      <button id="btnPlay" style="padding:3px 10px">▶ 播放序列</button>
      <span id="playInfo"></span>
    </div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ============================================================
 * 第一部分：ExParticle 1.16.5 反编译级解析器（与预览器同源）
 * ============================================================ */
const MATH_FUNCS = {
  sin:Math.sin,cos:Math.cos,tan:Math.tan,asin:Math.asin,acos:Math.acos,atan:Math.atan,
  atan2:Math.atan2,
  toRadians:d=>d*Math.PI/180,toDegrees:r=>r*180/Math.PI,
  exp:Math.exp,log:Math.log,log10:Math.log10,sqrt:Math.sqrt,cbrt:Math.cbrt,
  IEEEremainder:(f1,f2)=>f1-f2*Math.round(f1/f2),
  ceil:Math.ceil,floor:Math.floor,rint:Math.round,pow:Math.pow,round:Math.round,
  random:Math.random,
  addExact:(x,y)=>x+y,subtractExact:(x,y)=>x-y,multiplyExact:(x,y)=>x*y,
  incrementExact:a=>a+1,decrementExact:a=>a-1,negateExact:a=>-a,
  floorDiv:(x,y)=>Math.floor(x/y),floorMod:(x,y)=>((x%y)+y)%y,
  abs:Math.abs,max:Math.max,min:Math.min,
  ulp:d=>Math.abs(d)>1?Math.pow(2,-52)*Math.pow(2,Math.floor(Math.log2(Math.abs(d)))):Math.pow(2,-1074),
  signum:Math.sign,sinh:Math.sinh,cosh:Math.cosh,tanh:Math.tanh,hypot:Math.hypot,
  expm1:Math.expm1,log1p:Math.log1p,
  copySign:(m,s)=>Math.sign(s)===-1?-Math.abs(m):Math.abs(m),
  getExponent:d=>Math.floor(Math.log2(Math.abs(d))),
  scalb:(d,sf)=>d*Math.pow(2,sf),
  powerOfTwoD:n=>Math.pow(2,n)
};
function prepareExpr(src){
  src=src.replace(/\^/g,'**');
  src=src.replace(/&&/g,'\u0001A').replace(/\|\|/g,'\u0001O')
         .replace(/&/g,'&&').replace(/\|/g,'||')
         .replace(/\u0001A/g,'&&').replace(/\u0001O/g,'||');
  {
    const PRI='(?:[A-Za-z_]\\w*\\s*\\([^()]*\\)|\\([^()]*\\)|[\\w.]+)';
    const re=new RegExp('(^|[^\\w)\\]])\\s*([-!])\\s*('+PRI+')((?:\\s*\\*\\*\\s*'+PRI+')+)','g');
    src=src.replace(re,(m,pre,op,first,rest)=>pre+op+'('+first+rest+')');
  }
  return src;
}
function mop(op,A,B){
  const isM=Array.isArray(A)||Array.isArray(B);
  if(!isM){ return op==='+'?A+B:op==='-'?A-B:op==='*'?A*B:A/B; }
  const toM=x=>Array.isArray(x)?x:[[x]];
  A=toM(A); B=toM(B);
  if(op==='*'&&A[0].length===B.length){
    const r=[];
    for(let i=0;i<A.length;i++){ r.push([]);
      for(let j=0;j<B[0].length;j++){ let s=0; for(let k=0;k<B.length;k++)s+=A[i][k]*B[k][j]; r[i][j]=s; } }
    return r;
  }
  if(A.length===B.length&&A[0].length===B[0].length){
    return A.map((row,i)=>row.map((x,j)=>op==='+'?x+B[i][j]:op==='-'?x-B[i][j]:op==='*'?x*B[i][j]:x/B[i][j]));
  }
  if(A.length===1&&A[0].length===1){ const x=A[0][0];
    return B.map(row=>row.map(y=>op==='+'?x+y:op==='-'?x-y:op==='*'?x*y:x/y)); }
  if(B.length===1&&B[0].length===1){ const y=B[0][0];
    return A.map(row=>row.map(x=>op==='+'?x+y:op==='-'?x-y:op==='*'?x*y:x/y)); }
  return NaN;
}
function matTransform(src){
  src=src.replace(/,,/g,'\u0001');
  const topSplit=s=>{
    const out=[];let d=0,cur='';
    for(const ch of s){
      if(ch==='(')d++; else if(ch===')')d--;
      if(ch===','&&d===0){out.push(cur);cur='';}else cur+=ch;
    }
    out.push(cur); return out;
  };
  let guard=0;
  while(guard++<80){
    let done=true;
    for(let i=src.length-1;i>=0;i--){
      if(src[i]!=='(')continue;
      if(i>0&&/[\w$)]/.test(src[i-1]))continue;
      let depth=0,j=-1;
      for(let k=i;k<src.length;k++){ if(src[k]==='(')depth++; else if(src[k]===')'){depth--; if(depth===0){j=k;break;} } }
      if(j<0)break;
      const inner=src.slice(i+1,j);
      const isMat=inner.includes('\u0001')||topSplit(inner).length>1;
      if(isMat&&inner.trim()!==''){
        const rows=inner.split('\u0001').map(r=>topSplit(r).map(e=>e.trim()).filter(e=>e!==''));
        src=src.slice(0,i)+'MM(['+rows.map(r=>'['+r.join(',')+']').join(',')+'])'+src.slice(j+1);
        done=false; break;
      }
    }
    if(done)break;
  }
  const store=[];
  {
    let out='',i=0;
    while(i<src.length){
      if(src.startsWith('MM(',i)){
        let depth=0,j=i;
        for(;j<src.length;j++){
          const ch=src[j];
          if(ch==='(')depth++;
          else if(ch===')'){depth--; if(depth===0){j++;break;}}
        }
        store.push(src.slice(i,j));
        out+='〖'+(store.length-1)+'〗';
        i=j;
      } else out+=src[i++];
    }
    src=out;
  }
  const ph=n=>'〖'+n+'〗';
  const addComb=(a,o,b)=>{store.push('mop("'+o+'",'+a+','+b+')');return ph(store.length-1);};
  let gAll=0;
  while(gAll++<30){
    let changed=false;
    src=src.replace(/\(〖(\d+)〗\)/g,'〖$1〗');
    for(const ops of ['\\*\\/','\\+\\-']){
      let g2=0;
      while(g2++<80){
        const before=src;
        src=src.replace(new RegExp('〖(\\d+)〗\\s*(['+ops+'])\\s*〖(\\d+)〗','g'),(m,a,o,b)=>addComb(ph(a),o,ph(b)));
        src=src.replace(new RegExp('〖(\\d+)〗\\s*(['+ops+'])\\s*([A-Za-z_][\\w.]*|-?\\d+\\.?\\d*(?:[eE][-+]?\\d+)?)','g'),(m,a,o,b)=>addComb(ph(a),o,b));
        src=src.replace(new RegExp('([A-Za-z_][\\w.]*|-?\\d+\\.?\\d*(?:[eE][-+]?\\d+)?)\\s*(['+ops+'])\\s*〖(\\d+)〗','g'),(m,a,o,b)=>addComb(a,o,ph(b)));
        if(src!==before)changed=true;
        if(src===before)break;
      }
    }
    if(!changed)break;
  }
  const expand=(s,d)=>{ if(d>100)return s; return s.replace(/〖(\d+)〗/g,(m,n)=>expand(store[n],d+1)); };
  src=expand(src,0);
  return src.replace(/\u0001/g,',');
}
let _exprCut=null;
function blockCut(s){
  let d=0;
  for(let k=0;k<s.length;k++){
    if(s[k]==='(')d++;
    else if(s[k]===')'){ if(d===0){ _exprCut=s.slice(k); return s.slice(0,k); } d--; }
  }
  return s;
}
function runExpr(script, vars){
  script=blockCut(script.trim());
  if(script.startsWith('(')){
    let depth=0,end=-1;
    for(let k=0;k<script.length;k++){
      if(script[k]==='(')depth++;
      else if(script[k]===')'){depth--; if(depth===0){end=k;break;}}
    }
    if(end===script.length-1)script=script.slice(1,end);
  }
  const v = Object.create(null);
  Object.assign(v, MATH_FUNCS);
  v.PI=Math.PI; v.E=Math.E;
  v.MM=x=>x; v.mop=mop;
  Object.assign(v, vars);
  const keys = Object.keys(v);
  const stmts = script.split(';').map(s=>s.trim()).filter(Boolean);
  let last = 0;
  for(const st of stmts){
    let body = prepareExpr(st);
    if(body.trim().startsWith('(')){
      const s=body.trim();
      let depth=0,end=-1;
      for(let k=0;k<s.length;k++){ if(s[k]==='(')depth++; else if(s[k]===')'){depth--; if(depth===0){end=k;break;} } }
      const lhs=s.slice(1,end).replace(/,/g,',');
      const names=lhs.split(',').map(x=>x.trim()).filter(Boolean);
      const rest=s.slice(end+1).trim();
      if(rest.startsWith('=')){
        const rhs=matTransform(rest.slice(1));
        const val=evalIn(rhs,keys,v);
        const flat=Array.isArray(val)?val.flat(Infinity):[val];
        for(let n=0;n<names.length;n++){
          v[names[n]] = n<flat.length?flat[n]:NaN;
          if(!keys.includes(names[n]))keys.push(names[n]);
        }
        last=v[names[names.length-1]];
        continue;
      }
    }
    const m = body.match(/^([A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)*)\s*=\s*([\s\S]+)$/);
    if(m && !/==/.test(m[0].slice(0, m[0].indexOf('=')+2)) ){
      const names = m[1].split(',').map(s=>s.trim());
      const vals  = splitTop(m[2]).map(s=>s.trim());
      for(let i=0;i<names.length;i++){
        const val = i < vals.length ? evalIn(matTransform(vals[i]), keys, v) : NaN;
        v[names[i]] = Array.isArray(val)?val.flat(Infinity)[0]:val;
        if(!keys.includes(names[i])) keys.push(names[i]);
      }
      last = v[names[names.length-1]];
    }else{
      last = evalIn(matTransform(body), keys, v);
    }
  }
  const out = {};
  for(const k of keys){ if(!(k in MATH_FUNCS) && k!=='PI' && k!=='E' && k!=='MM' && k!=='mop') out[k]=v[k]; }
  return {vars:out, last};
}
const _fnCache=new Map();
function evalIn(expr, keys, v){
  const ck=expr+'\u0000'+keys.join(',');
  let f=_fnCache.get(ck);
  if(!f){
    try{ f=new Function(...keys, `return (${expr});`); }
    catch(e){ throw new Error('表达式错误: '+expr+' → '+e.message); }
    if(_fnCache.size>4000)_fnCache.clear();
    _fnCache.set(ck,f);
  }
  try{ return f(...keys.map(k=>v[k])); }
  catch(e){ throw new Error('表达式错误: '+expr+' → '+e.message); }
}
function splitTop(s){
  const out=[]; let depth=0, cur='';
  for(const ch of s){
    if(ch==='(')depth++; if(ch===')')depth--;
    if(ch===','&&depth===0){out.push(cur);cur='';}else cur+=ch;
  }
  if(cur.trim())out.push(cur);
  return out;
}
function tokenize(s){
  s=s.replace(/[\u201c\u201d]/g,'"').replace(/[\u2018\u2019]/g,"'").replace(/\u3000/g,' ').replace(/\uff0c/g,' ');
  const toks=[];let cur='',q=false;
  for(const ch of s){if(ch==='"'||ch==="'"){q=!q;continue;}if(ch===' '&&!q){if(cur){toks.push(cur);cur='';}}else cur+=ch;}
  if(cur)toks.push(cur);return toks;
}
function parseCommands(text){
  const cmds=[];
  for(let raw of text.split('\n')){
    let line=raw.trim();
    if(!line||line.startsWith('#'))continue;
    if(line.startsWith('/'))line=line.slice(1);
    if(!line.startsWith('particleex ')){cmds.push({type:'unknown',raw:line});continue;}
    const toks=tokenize(line.slice('particleex '.length));
    const sub=toks[0]; const c={raw:line,type:sub};
    let i=1;
    const num=()=>{ if(i>=toks.length)throw new Error('参数不足: '+line); const v=parseFloat(toks[i++]); if(isNaN(v))throw new Error('需要数字，得到 "'+toks[i-1]+'"'); return v; };
    const readN=n=>{ const out=[]; for(let k=0;k<n;k++)out.push(num()); return out; };
    const str=()=>{ if(i>=toks.length)throw new Error('参数不足: '+line); return toks[i++]; };
    const maybeStr=()=>{ const s=toks[i]; if(s===undefined)return null; i++; return (s==='null')?null:s; };
    try{
      if(sub==='clearparticle'||sub==='clearcache'){ i=toks.length; c.type='unsupported'; c.sub=sub; }
      else if(sub==='image'||sub==='imagematrix'||sub==='video'||sub==='videomatrix'){
        c.type='unsupported'; c.sub=sub;
      }
      else if(sub==='group'){ c.type='unsupported'; c.sub='group'; }
      else{
        c.name=str();
        if(toks[i]!==undefined&&toks[i].startsWith('~')){
          const p=[];
          c.posRaw=[];
          for(let k=0;k<3;k++){ const t=toks[i++]; c.posRaw.push(t); const m=t.match(/^~(-?[\d.]*)$/); p.push(m?(m[1]===''?0:parseFloat(m[1])):parseFloat(t)); }
          c.pos=p;
        }
        if(sub.startsWith('rgba')){
          c.color={r:1,g:1,b:1,a:1}; c.rgbaVariant=true;
        }else{
          if(i+3>=toks.length)throw new Error('color4 需要 4 个数 (r g b a 0~1)');
          const cc=readN(4);
          for(const v of cc)if(v<0||v>1)throw new Error('color4 每个值须在 0~1 之间，若这条在游戏能用请检查是否为 rgba 变体指令');
          c.color={r:cc[0],g:cc[1],b:cc[2],a:cc[3]};
        }
        c.speed=readN(3);
        if(sub==='normal'){
          c.range=readN(3);
          c.count=parseInt(toks[i++]||1);

    var rx=c.range[0], ry=c.range[1], rz=c.range[2];
    if (!rx && !ry && !rz){
      if (rot){ rx=1; ry=1; rz=1; warns.push('原指令范围是 0（单粒子绕圈效果），已用范围 1 模拟'); }
      else { rx=5; ry=5; rz=5; warns.push('范围全是 0，已按 5 算'); }
    } else if (!rx || !ry || !rz){ rx=rx||5; ry=ry||5; rz=rz||5; warns.push('范围有 0，已按 5 算'); }
    var id = mapParticle(c.name, warns);
    if (c.group) warns.push('分组 "'+c.group+'" 在基岩包里没有对应能力，已忽略');
    var cmd = '/fxn '+id+' '+posStr(c,1)+' '+rx+' '+ry+' '+rz+' '+count+' 4 '+life+' '+rot+' '+rise+' '+expand+' normal';
    var col = c.color;
    for (var i=0;i<Math.min(count,400);i++){
      points.push({x:(Math.random()*2-1)*rx, y:(Math.random()*2-1)*ry, z:(Math.random()*2-1)*rz,
        r:col.r, g:col.g, b:col.b});
    }
    return {mode:'fxn', cmd:cmd,
      anim:{rot:rot||0.05, rise:rise, expand:expand, count:count, lifeTicks:Math.round(life*20), rx:rx, ry:ry, rz:rz},
      lifeSec:life, desc:'范围随机粒子云（'+count+' 个，寿命 '+life+' 秒）'+(rot?'，旋转':'')+(rise?'，上升':'')+(expand?'，扩散':'')};
  }
  if (c.type==='conditional'){
    var rx2=c.range[0], ry2=c.range[1], rz2=c.range[2];
    if (!rx2 || !ry2 || !rz2){ rx2=rx2||3; ry2=ry2||3; rz2=rz2||3; warns.push('范围里有 0，已按 3 算'); }
    var dim = Math.max(2*rx2, 2*ry2, 2*rz2);
    var need = dim/Math.pow(MAX_POINTS, 1/3);
    var st = c.step;
    var autoWiden = false;
    if (st < need){ st = need; autoWiden = true; }
    st = Math.round(st*1000)/1000;
    if (st < 0.02) st = 0.02;
    var n=0, cand=0, CAP=MAX_POINTS;
    var col2 = c.color;
    for(let cx=-rx2;cx<=rx2+1e-9;cx+=st){
      for(let cy=-ry2;cy<=ry2+1e-9;cy+=st){
        for(let cz=-rz2;cz<=rz2+1e-9;cz+=st){
          if(n>=CAP)break;
          cand++;
          try{
            const r=runExpr(c.expr,{x:cx,y:cy,z:cz,s1:Math.atan2(cz,cx),s2:Math.atan2(cy,Math.hypot(cx,cz)),
              dis:Math.sqrt(cx*cx+cy*cy+cz*cz)});
            if(r.last&&r.last!==0){
              n++;
              points.push({x:cx,y:cy,z:cz,r:col2.r,g:col2.g,b:col2.b});
            }
          }catch(e){ throw new Error('条件表达式求值失败: '+e.message); }
        }
        if(n>=CAP)break;
      }
      if(n>=CAP)break;
    }
    if (!n) throw new Error('这个条件下一个点都没有：检查条件表达式（如球壳写 dis>1&dis<1.25，立方体要 abs(x)<1&abs(y)<1&abs(z)<1 三轴都限）');
    if (autoWiden) warns.push('范围太大，扫描步长自动放宽到 '+st.toFixed(3)+'（防超过 '+MAX_POINTS+' 点上限），形状会稀疏一点');
    if (n>=CAP) warns.push('命中点数已达上限 '+MAX_POINTS+' 被截断');
    if (c.age>0) warns.push('寿命参数（'+c.age+'tick）在基岩包 /fxc 里没有对应参数，已忽略');
    if (c.speedExpr && c.speedExpr!=='null') warns.push('速度表达式在基岩包 /fxc 里不支持，已忽略（条件形状是静态的）');
    var grp = c.group||'cond';
    if (grp && !/^[A-Za-z0-9_]+$/.test(grp)){ grp='cond'; warns.push('分组名含非法字符，已按默认组 cond 处理'); }
    var id2 = mapParticle(c.name, warns);
    var cmd2 = '/fxc '+id2+' '+posStr(c,1)+' '+rx2+' '+ry2+' '+rz2+' '+st+' "'+c.expr+'" '+grp;
    return {mode:'fxc', cmd:cmd2, desc:'条件实心形状，'+n+' 个粒子（扫描 '+cand+' 点）'};
  }
  if (c.type.endsWith('parameter')){
    var v=c.variant||'';
    var isPolar=v.includes('polar'), isTick=v.includes('tick'), isRgba=v.includes('rgba');
    if (isRgba) warns.push('rgba 变体的颜色由表达式给出，基岩版不支持表达式调色，已忽略 cr/cg/cb/alpha');
    if (isTick) warns.push('Java 的逐帧流式动画（tickparameter，CPT='+(c.cpt||10)+'）按一次性生成完整形状处理');
    if (c.age>0) warns.push('寿命参数（'+c.age+'tick）在基岩包 /fx 里没有对应参数，已忽略');
    if (c.group) warns.push('分组 "'+c.group+'" 在基岩包里没有对应能力，已忽略');
    var expr = transformExpr(c.expr, isPolar, warns);
    var step = Math.abs(c.step)||0.1;
    var nPts = Math.floor((c.end-c.begin)/step + 1e-9)+1;
    var effStep = step;
    if (nPts > MAX_POINTS){
      var factor = Math.ceil(nPts/MAX_POINTS);
      effStep = step*factor;
      warns.push('原间隔会生成 '+nPts+' 个点，超过基岩包硬上限 '+MAX_POINTS+'，已自动把间隔放大为 '+effStep+'（抽稀约 '+factor+' 倍）');
    }
    var col3 = c.color;
    var skipped=0, degenerate=true, lx0=null,ly0=null,lz0=null;
    for(let t=c.begin;t<=c.end+1e-9;t+=effStep){
      // 游戏里 x/y/z/s1/s2/dis 未赋值时默认 0，裸引用不报错
      const vars={t,vx:c.speed[0],vy:c.speed[1],vz:c.speed[2],cr:col3.r,cg:col3.g,cb:col3.b,alpha:col3.a,count:1,
        x:0,y:0,z:0,s1:0,s2:0,dis:0};
      const r=runExpr(c.expr,vars); Object.assign(vars,r.vars);
      let dx,dy,dz;
      if(isPolar){
        var vv=vars;
        dx=vv.dis*Math.cos(vv.s2)*Math.cos(vv.s1);
        dy=vv.dis*Math.sin(vv.s2);
        dz=vv.dis*Math.cos(vv.s2)*Math.sin(vv.s1);
      } else { dx=vars.x??0;dy=vars.y??0;dz=vars.z??0; }
      if(!isFinite(dx)||!isFinite(dy)||!isFinite(dz)){ skipped++; continue; }
      if (Math.abs(dx)>32||Math.abs(dy)>32||Math.abs(dz)>32){ skipped++; continue; }
      points.push({x:dx,y:dy,z:dz,r:col3.r,g:col3.g,b:col3.b});
      if (lx0===null){ lx0=dx;ly0=dy;lz0=dz; }
      else if (Math.abs(dx-lx0)+Math.abs(dy-ly0)+Math.abs(dz-lz0)>1e-9) degenerate=false;
    }
    if (!points.length) throw new Error('表达式求值后没有有效点（全是奇点或超出32格渲染距离）');
    if (degenerate) warns.push('表达式求值后所有点几乎重合（图形退化成一个点）——检查 x/y/z 是不是真的随 t 变化');
    if (skipped) warns.push('有 '+skipped+' 个点在表达式奇点上或超出32格渲染距离，已跳过');
    var cmdExpr = expr;
    if (cmdExpr.indexOf('^')>=0){
      var cvt = caretToPow(cmdExpr);
      if (cvt){ cmdExpr=cvt; warns.push('表达式里的 ^ 已自动转成 pow()（游戏聊天栏打不出 ^ 符号）'); }
      else warns.push('^ 自动转 pow() 失败，请手动把 a^b 改写成 pow(a,b) 再进游戏');
    }
    var spin = null;
    if (c.speedExpr){
      var seTrim = String(c.speedExpr).trim();
      if (/^cos\(t\)$/i.test(seTrim)){
        // 手动调参写入的 cos(t) 旋转：角速度 = 速度步长
        spin = c.speedStep>0 ? c.speedStep : 0.05;
      } else {
      var pv = parseVelocity(c.speedExpr);
      if (pv.rot){
        spin = pv.rot;
        if (pv.rotArg==='t'){
          if (c.speedStep>0) spin = c.speedStep;
          else { spin = 0.05; warns.push('速度表达式用了 cos(t) 旋转但没识别到速度步长，默认角速度 0.05'); }
        }
        warns.push('识别到旋转动画 → 已写进指令（游戏里整个形状绕竖直轴转）');
      } else if (pv.rise || pv.expand){
        warns.push('速度表达式是上升/扩散类动画，/fx 静态形状做不了；要这种动态请用 normal 写法（转出来是 /fxn）');
      } else if (pv.horizontal || pv.kind==='other'){
        warns.push('速度表达式是水平移动或其他复杂运动，基岩版模拟不了，已忽略');
      }
      }
    }
    var id3 = mapParticle(c.name, warns);
    var cmd3 = '/fx param '+id3+' '+posStr(c,3)+' '+c.begin+' '+c.end+' '+effStep+' 0 "'+cmdExpr+'" default 1'+(spin?(' '+spin):'');
    if (cmd3.length>800) warns.push('转换结果超长（'+cmd3.length+' 字符）：聊天栏多半贴不下，用命令方块');
    return {mode:'fx', cmd:cmd3, spin:spin||0, desc:points.length+' 个粒子'+(spin?'，含旋转动画':'')};
  }
  return null;
}

/* ============================================================
 * 第三部分：3D 预览（Canvas）+ 序列播放引擎
 * ============================================================ */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let cam={theta:0.6, phi:1.15, dist:14};
let dragging=false,lx=0,ly=0;
cv.addEventListener('mousedown',e=>{dragging=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',()=>dragging=false);
window.addEventListener('mousemove',e=>{
  if(!dragging)return;
  cam.theta+=(e.clientX-lx)*0.006;
  cam.phi+=(e.clientY-ly)*0.006;
  cam.phi=Math.max(0.08,Math.min(Math.PI-0.08,cam.phi));
  lx=e.clientX;ly=e.clientY;
});
cv.addEventListener('wheel',e=>{e.preventDefault();cam.dist*=e.deltaY>0?1.1:0.9;cam.dist=Math.max(1,Math.min(120,cam.dist));},{passive:false});
// 触屏：单指旋转，双指捏合缩放
let tDist=0;
cv.addEventListener('touchstart',e=>{
  if (e.touches.length===1){ dragging=true; lx=e.touches[0].clientX; ly=e.touches[0].clientY; }
  else if (e.touches.length===2){ dragging=false; tDist=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY); }
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchmove',e=>{
  if (e.touches.length===1 && dragging){
    cam.theta+=(e.touches[0].clientX-lx)*0.006;
    cam.phi+=(e.touches[0].clientY-ly)*0.006;
    cam.phi=Math.max(0.08,Math.min(Math.PI-0.08,cam.phi));
    lx=e.touches[0].clientX; ly=e.touches[0].clientY;
  } else if (e.touches.length===2){
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX, e.touches[0].clientY-e.touches[1].clientY);
    if (tDist>0 && d>0){ cam.dist*=(tDist/d); cam.dist=Math.max(1,Math.min(120,cam.dist)); }
    tDist=d;
  }
  e.preventDefault();
},{passive:false});
cv.addEventListener('touchend',e=>{ if (e.touches.length===0) dragging=false; if (e.touches.length<2) tDist=0; },{passive:false});
function resize(){cv.width=cv.clientWidth;cv.height=cv.clientHeight;}
window.addEventListener('resize',resize);
function project(x,y,z){
  const st=Math.sin(cam.theta),ct=Math.cos(cam.theta),sp=Math.sin(cam.phi),cp=Math.cos(cam.phi);
  const fx=-sp*st, fy=-cp, fz=-sp*ct;
  const rx=ct, ry=0, rz=-st;
  const ux=-st*cp, uy=sp, uz=-ct*cp;
  const depth = x*fx+y*fy+z*fz;
  const sx = x*rx+y*ry+z*rz;
  const sy = x*ux+y*uy+z*uz;
  const scale = 900/Math.max(2, cam.dist-depth);
  return {x:cv.width/2 + sx*scale, y:cv.height/2 - sy*scale, s:Math.max(0.25, scale/64), d:depth};
}
function clamp255(v){return Math.max(0,Math.min(255,Math.round((v||0)*255)));}
function line3(x1,y1,z1,x2,y2,z2){
  const a=project(x1,y1,z1),b=project(x2,y2,z2);
  ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();
}
function drawSceneBg(){
  ctx.fillStyle='#101218'; ctx.fillRect(0,0,cv.width,cv.height);
  ctx.strokeStyle='rgba(80,90,110,.25)'; ctx.lineWidth=1;
  for(let i=-8;i<=8;i++){ line3(-8,0,i,8,0,i); line3(i,0,-8,i,0,8); }
  ctx.strokeStyle='rgba(255,100,100,.6)'; line3(0,0,0,2,0,0);
  ctx.strokeStyle='rgba(100,255,100,.6)'; line3(0,0,0,0,2,0);
  ctx.strokeStyle='rgba(100,100,255,.6)'; line3(0,0,0,0,0,2);
}
function drawPts(list){
  if(!list||!list.length)return;
  const sq=list.length>4000;
  for(const p of list){
    const pr=project(p.x,p.y,p.z);
    const r=Math.max(1.5, 3.2*pr.s);
    ctx.globalAlpha=1;
    ctx.fillStyle=`rgb(${clamp255(p.r)},${clamp255(p.g)},${clamp255(p.b)})`;
    if(sq){ ctx.fillRect(pr.x-r,pr.y-r,r*2,r*2); }
    else{ ctx.beginPath();ctx.arc(pr.x,pr.y,r,0,Math.PI*2);ctx.fill(); }
    ctx.globalAlpha=1;
  }
}
function fitView(){
  var m=0;
  for(const e of entries){
    for(const p of (e.points||[])){ m=Math.max(m,Math.abs(p.x),Math.abs(p.y),Math.abs(p.z)); }
    if (e.result && e.result.anim){ var a=e.result.anim; m=Math.max(m, a.rx*2, a.ry*2, a.rz*2); }
  }
  cam.dist = Math.max(4, Math.min(80, m*2.2+2));
}

// ---------- 序列状态 ----------
let entries=[];          // {raw, c, result, points, play:{mode,delay,showSec}, startTick, showTicks, pool}
let playing=false, playTick=0, playAcc=0, lastT=performance.now(), totalTicks=0;
const TPS=20;

function computeTimeline(){
  var prevStart=0, prevEnd=0;
  for (const e of entries){
    var show = e.result && e.result.mode==='fxn' ? e.result.anim.lifeTicks : Math.round((e.play.showSec||5)*TPS);
    e.showTicks = Math.max(TPS, show);
    var st;
    if (e.play.mode==='wait'){ st = prevEnd + Math.max(0, e.play.delay||0); }
    else if (e.play.mode==='delay'){ st = prevStart + Math.max(0, e.play.delay||0); }
    else { st = prevStart; }  // 同时
    e.startTick = st;
    prevStart = st; prevEnd = Math.max(prevEnd, st + e.showTicks);
  }
  totalTicks = entries.length ? Math.max(1, prevEnd) : 0;
}
function ensurePool(e){
  if (e.pool) return e.pool;
  var a = e.result.anim;
  e.pool = {a:a, parts:[]};
  return e.pool;
}
function resetPool(e){
  e.pool = {a:e.result.anim, parts:[]};
}
function tickPool(e){
  var pool = e.pool; if(!pool)return;
  var a = pool.a;
  var c = Math.cos(a.rot), s = Math.sin(a.rot);
  var alive = [];
  for (var i=0;i<pool.parts.length;i++){
    var p = pool.parts[i];
    p.age++;
    if (p.age >= a.lifeTicks) continue;
    var ox = p.x, oy = p.y, oz = p.z;
    if (a.expand){ var f = 1.0 + a.expand; ox*=f; oy*=f; oz*=f; }
    if (a.rot){ var nx = ox*c - oz*s, nz = ox*s + oz*c; ox=nx; oz=nz; }
    if (a.rise) oy += a.rise;
    p.x=ox; p.y=oy; p.z=oz;
    alive.push(p);
  }
  pool.parts = alive;
  var add = Math.min(4, a.count - pool.parts.length);
  for (var k=0;k<add;k++){
    pool.parts.push({x:(Math.random()*2-1)*a.rx, y:(Math.random()*2-1)*a.ry,
      z:(Math.random()*2-1)*a.rz, age:0});
  }
}
// 非播放模式：fxn 云持续循环动画
function tickIdle(){
  for (const e of entries){
    if (e.result && e.result.mode==='fxn'){
      if (!e.pool) resetPool(e);
      for (var g=0; g<1; g++) tickPool(e);
    }
  }
}
function rotPts(pts, ang){
  if (!ang) return pts;
  const c=Math.cos(ang), s=Math.sin(ang);
  const out=[];
  for(const p of pts){ out.push({x:p.x*c-p.z*s, y:p.y, z:p.x*s+p.z*c, r:p.r, g:p.g, b:p.b}); }
  return out;
}
let spinIdle=0;
function render(){
  drawSceneBg();
  var count=0;
  if (playing){
    for (const e of entries){
      var active = playTick >= e.startTick && playTick < e.startTick + e.showTicks;
      if (!active){
        if (e.result && e.result.mode==='fxn' && e.pool && playTick===e.startTick) {} // will reset below
        continue;
      }
      if (e.result && e.result.mode==='fxn'){
        if (!e.pool || e._lastStart!==e.startTick){ resetPool(e); e._lastStart=e.startTick; }
        tickPool(e);
        var list = e.pool.parts.map(p=>({x:p.x,y:p.y,z:p.z,r:0.42,g:0.85,b:1.0}));
        drawPts(list); count+=list.length;
      } else {
        var local = playTick - e.startTick;
        var ang = (e.result && e.result.spin) ? e.result.spin * local / TPS : 0;
        drawPts(rotPts(e.points, ang)); count+=e.points.length;
      }
    }
    var pc=document.getElementById('playInfo');
    pc.textContent='第 '+(Math.floor(playTick/TPS))+'.'+(playTick%TPS)+' 秒 / 共 '+Math.round(totalTicks/TPS)+' 秒';
  } else {
    tickIdle();
    for (const e of entries){
      if (e.result && e.result.mode==='fxn'){
        if (e.pool){
          var list2 = e.pool.parts.map(p=>({x:p.x,y:p.y,z:p.z,r:0.42,g:0.85,b:1.0}));
          drawPts(list2); count+=list2.length;
        }
      } else {
        drawPts(e.points); count+=e.points.length;
      }
    }
    document.getElementById('playInfo').textContent='';
  }
  document.getElementById('pcount').textContent = count;
}
function loop(now){
  var dt = Math.min(200, now - lastT); lastT = now;
  if (playing){
    playAcc += dt;
    while (playAcc >= 1000/TPS){
      playAcc -= 1000/TPS;
      playTick++;
      if (playTick >= totalTicks){ playTick = 0; for (const e of entries){ e._lastStart=null; } updateTimelineUI(); }
    }
    updateTimelineUI();
  }
  render();
  requestAnimationFrame(loop);
}
function startPlayback(){
  if (!entries.length) return;
  computeTimeline();
  playing=true; playTick=0; playAcc=0; lastT=performance.now();
  for (const e of entries){ e.pool=null; e._lastStart=null; }
  document.getElementById('btnPlay').textContent='⏹ 停止播放';
}
function stopPlayback(){
  playing=false;
  for (const e of entries){ e.pool=null; }
  document.getElementById('btnPlay').textContent='▶ 播放序列';
  document.getElementById('playInfo').textContent='';
}

/* ============================================================
 * 第四部分：UI（参数面板 + 时间轴 + 主流程）
 * ============================================================ */
function logEl(msg,cls){const d=document.createElement('div');d.className=cls;d.textContent=msg;document.getElementById('log').appendChild(d);}
function toast(t){
  var el=document.getElementById('toast');
  el.textContent=t; el.classList.add('show');
  clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove('show'),1400);
}
function copyText(txt, tip){
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(tip||'已复制！'),()=>{fallbackCopy(txt,tip);});
  } else fallbackCopy(txt,tip);
}
function fallbackCopy(txt,tip){
  var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta);
  ta.select(); try{ document.execCommand('copy'); toast(tip||'已复制！'); }catch(e){ toast('复制失败，请手动选择'); }
  document.body.removeChild(ta);
}

function modeLabel(m){ return m==='fxn'?'/fxn 范围随机':(m==='fxc'?'/fxc 条件形状':'/fx 参数形状'); }

// 参数面板：根据模式生成输入项；改动 → 打补丁到 c → 重转该条
function buildParamPanel(entry, card){
  var wrap=document.createElement('div'); wrap.className='pgrid';
  var c=entry.c, r=entry.result;
  function numField(label, get, set, step){
    var f=document.createElement('label'); f.className='pf';
    var s=document.createElement('span'); s.textContent=label;
    var inp=document.createElement('input'); inp.type='number';
    if(step)inp.step=step;
    inp.value=get();
    inp.addEventListener('change',()=>{
      var v=parseFloat(inp.value);
      if(isNaN(v)){ inp.value=get(); return; }
      set(v); reconvertEntry(entry);
    });
    f.appendChild(s); f.appendChild(inp); wrap.appendChild(f);
  }
  function textField(label, cls, get, set){
    var f=document.createElement('label'); f.className='pf fw';
    var s=document.createElement('span'); s.textContent=label;
    var inp=document.createElement('input'); inp.type='text';
    if(cls)inp.className=cls;
    inp.value=get();
    inp.addEventListener('change',()=>{
      if(!inp.value.trim()){ inp.value=get(); return; }
      set(inp.value); reconvertEntry(entry);
    });
    f.appendChild(s); f.appendChild(inp); wrap.appendChild(f);
    return f;
  }
  // 通用：粒子名 / 坐标（改坐标分量后按绝对坐标写入，不再保留 ~）
  textField('粒子ID', '', ()=>c.name, v=>{ c.name=v; });
  numField('X', ()=>(c.pos?c.pos[0]:0), v=>{ c.pos=c.pos||[0,1,0]; c.pos[0]=v; c.posRaw=c.posRaw||['~','~1','~']; c.posRaw[0]=String(v); });
  numField('Y', ()=>(c.pos?c.pos[1]:1), v=>{ c.pos=c.pos||[0,1,0]; c.pos[1]=v; c.posRaw=c.posRaw||['~','~1','~']; c.posRaw[1]=String(v); });
  numField('Z', ()=>(c.pos?c.pos[2]:0), v=>{ c.pos=c.pos||[0,1,0]; c.pos[2]=v; c.posRaw=c.posRaw||['~','~1','~']; c.posRaw[2]=String(v); });
  if (r.mode==='fxn'){
    numField('范围X', ()=>c.range[0], v=>{ c.range[0]=v; });
    numField('范围Y', ()=>c.range[1], v=>{ c.range[1]=v; });
    numField('范围Z', ()=>c.range[2], v=>{ c.range[2]=v; });
    numField('数量', ()=>c.count, v=>{ c.count=Math.round(v); }, 1);
    numField('寿命秒', ()=>(c.age>0?Math.round(c.age/20*10)/10:5), v=>{ c.age=Math.round(v*20); }, 0.5);
    numField('旋转', ()=>0, v=>{ entry.forceRot=v; });
    numField('上升', ()=>0, v=>{ entry.forceRise=v; });
    numField('扩散', ()=>0, v=>{ entry.forceExpand=v; });
  } else if (r.mode==='fxc'){
    numField('范围X', ()=>c.range[0], v=>{ c.range[0]=v; });
    numField('范围Y', ()=>c.range[1], v=>{ c.range[1]=v; });
    numField('范围Z', ()=>c.range[2], v=>{ c.range[2]=v; });
    numField('步长', ()=>c.step, v=>{ if(v>0)c.step=v; }, 0.01);
    textField('条件表达式', 'wide', ()=>c.expr, v=>{ c.expr=v; });
    textField('组名', '', ()=>(c.group||'cond'), v=>{ c.group=v; });
  } else if (r.mode==='fx'){
    numField('t起', ()=>c.begin, v=>{ c.begin=v; });
    numField('t终', ()=>c.end, v=>{ c.end=v; });
    numField('间隔', ()=>c.step, v=>{ if(v>0)c.step=v; }, 0.01);
    numField('旋转', ()=>(entry.result.spin||0), v=>{ entry.forceSpin=v; }, 0.01);
    textField('表达式(Java原式)', 'wide', ()=>c.expr, v=>{ c.expr=v; });
  }
  card.appendChild(wrap);
  return wrap;
}
// 播放编排面板
function buildPlayPanel(entry, card){
  var wrap=document.createElement('div'); wrap.className='playRow';
  var lab=document.createElement('span'); lab.style.fontSize='11px'; lab.style.color='var(--dim)';
  lab.textContent='执行时机';
  var sel=document.createElement('select');
  sel.innerHTML='<option value="wait">等上一个播完后</option><option value="delay">上一个开始后固定延迟</option><option value="now">与上一个同时</option>';
  sel.value=entry.play.mode;
  sel.addEventListener('change',()=>{ entry.play.mode=sel.value; computeTimeline(); updateTimelineUI(); updateSeqText(); });
  var dl=document.createElement('label'); dl.className='pf';
  dl.innerHTML='延迟 <input type="number" style="width:52px;background:#17191d;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;padding:3px 5px"> tick';
  var dInp=dl.querySelector('input'); dInp.value=entry.play.delay;
  dInp.addEventListener('change',()=>{ var v=parseInt(dInp.value); entry.play.delay=isNaN(v)?0:Math.max(0,v); computeTimeline(); updateTimelineUI(); updateSeqText(); });
  var sl=document.createElement('label'); sl.className='pf';
  sl.innerHTML='展示时长 <input type="number" style="width:48px;background:#17191d;border:1px solid var(--border);border-radius:4px;color:var(--text);font-size:11px;padding:3px 5px"> 秒';
  var sInp=sl.querySelector('input'); sInp.value=entry.play.showSec;
  if (entry.result && entry.result.mode==='fxn'){ sInp.value='(自动)'; sInp.disabled=true; }
  sInp.addEventListener('change',()=>{ var v=parseFloat(sInp.value); if(v>0)entry.play.showSec=v; else sInp.value=entry.play.showSec; computeTimeline(); updateTimelineUI(); updateSeqText(); });
  wrap.appendChild(lab); wrap.appendChild(sel); wrap.appendChild(dl); wrap.appendChild(sl);
  card.appendChild(wrap);
}
// 时间轴条
function buildTimeline(entry, card){
  var wrap=document.createElement('div'); wrap.className='tl';
  wrap.innerHTML='<div class="tlbar"><div class="tlseg"></div><div class="tlcur"></div></div><div class="tlinfo"></div>';
  card.appendChild(wrap);
  entry._tl=wrap;
}
function updateTimelineUI(){
  var total = totalTicks || 1;
  for (const e of entries){
    if (!e._tl) continue;
    var seg=e._tl.querySelector('.tlseg'), cur=e._tl.querySelector('.tlcur'), info=e._tl.querySelector('.tlinfo');
    seg.style.left=(e.startTick/total*100)+'%';
    seg.style.width=(e.showTicks/total*100)+'%';
    info.textContent='第 '+(e.startTick/TPS).toFixed(1)+'s → '+((e.startTick+e.showTicks)/TPS).toFixed(1)+'s（'+e.showTicks+' tick）';
    cur.style.display=playing?'block':'none';
    cur.style.left=(playTick/total*100)+'%';
  }
}

// ---------- 重转单条 ----------
function reconvertEntry(entry){
  var log=document.getElementById('log');
  var warns=[];
  try{
    var points=[];
    // 应用手动覆盖的动态参数
    if (entry.result && entry.result.mode==='fxn' && (entry.forceRot||entry.forceRise||entry.forceExpand)){
      // 把旋转/上升/扩散写进速度表达式（单条向量赋值、数值字面量，保证能被识别）
      var rot=parseFloat(entry.forceRot)||0, rise=parseFloat(entry.forceRise)||0, exp=parseFloat(entry.forceExpand)||0;
      if (rot){
        var ar=Math.abs(rot);
        c.speedExpr='(vx,,vy,,vz)=(-'+ar+'*z,'+(rise||0)+','+ar+'*x)';
      } else if (exp||rise){
        c.speedExpr='(vx,,vy,,vz)=('+exp+'*x,'+(rise?(exp?(rise+'+'+exp+'*y'):rise):(exp+'*y'))+','+exp+'*z)';
      } else c.speedExpr=null;
      c.speedStep=1.0;
    }
    if (entry.result && entry.result.mode==='fx' && entry.forceSpin!==undefined){
      // cos(t) 型旋转：convertCmd 里角速度取 speedStep
      c.speedExpr = entry.forceSpin ? 'cos(t)' : null;
      c.speedStep = entry.forceSpin||0;
    }
    var r=convertCmd(entry.c, warns, points);
    if(!r)return;
    entry.result=r; entry.points=points; entry.pool=null;
    computeTimeline();
    updateTimelineUI();
    updateSeqText();
    fitView();
    // 更新卡片
    entry._cmdDiv.textContent=r.cmd;
    var md=entry._modeSpan; if(md)md.textContent=modeLabel(r.mode)+' · '+r.desc;
    if (warns.length) logEl('⚠ ['+(entry.no)+'] '+warns.join('；'),'warn');
  }catch(e){
    logEl('✘ 参数错误 ['+(entry.no||'')+']: '+e.message,'err');
  }
}

// ---------- 主转换流程 ----------
function doConvert(quiet){
  stopPlayback();
  const log=document.getElementById('log');
  log.innerHTML='';
  const outList=document.getElementById('outList');
  outList.innerHTML='';
  entries=[];
  const text=document.getElementById('cmd').value;
  let cmds;
  try{ cmds=parseCommands(text); }
  catch(e){ logEl('解析失败: '+e.message,'err'); return; }
  let ok=0, no=0;
  for(const c of cmds){
    if(c.type==='unknown'){ logEl('⏭ 忽略（不是 particleex 指令）: '+c.raw,'info'); continue; }
    if(c.type==='error'){ logEl('✘ '+c.msg+' — '+c.raw,'err'); continue; }
    if(c.type==='unsupported'){ logEl('⏭ '+c.sub+'：图片/视频/分组管理类子命令，基岩版暂不支持，已跳过','warn'); continue; }
    no++;
    const warns=[];
    try{
      const points=[];
      const r=convertCmd(c, warns, points);
      if(!r){no--;continue;}
      ok++;
      const entry={raw:c.raw, c:c, result:r, points:points, no:no,
        play:{mode: no===1?'wait':'wait', delay:0, showSec:5}, startTick:0, showTicks:100, pool:null};
      entries.push(entry);
      for(const w of warns) logEl('⚠ '+w,'warn');
      if(_exprCut!==null){ logEl('✘ 表达式末尾有多余内容 "'+_exprCut+'"，已忽略；建议删掉','err'); _exprCut=null; }
      logEl('✔ ['+no+'] '+c.type+(c.variant||'')+' → '+r.mode+' · '+r.desc,'ok');
      // 卡片 UI
      const card=document.createElement('div'); card.className='card';
      const head=document.createElement('div');
      head.innerHTML='<span class="no">'+no+'</span><span class="mode"></span>';
      card.appendChild(head);
      entry._modeSpan=head.querySelector('.mode');
      entry._modeSpan.textContent=modeLabel(r.mode)+' · '+r.desc;
      const cmdDiv=document.createElement('div'); cmdDiv.className='outCmd';
      cmdDiv.textContent=r.cmd;
      const cp=document.createElement('span'); cp.className='cp'; cp.textContent='点击复制';
      cmdDiv.appendChild(cp);
      cmdDiv.onclick=()=>copyText(entry.result.cmd);
      card.appendChild(cmdDiv);
      entry._cmdDiv=cmdDiv;
      buildParamPanel(entry, card);
      buildPlayPanel(entry, card);
      buildTimeline(entry, card);
      outList.appendChild(card);
    }catch(e){
      no--;
      logEl('✘ '+e.message+' — '+c.raw,'err');
    }
  }
  if (ok){
    computeTimeline(); updateTimelineUI(); updateSeqText(); fitView();
    logEl('— 共 '+ok+' 条转换成功。下方每条可调参数；「播放序列」按编排预览执行顺序','info');
  } else if (!quiet && !cmds.some(c=>c.type==='error')){
    logEl('没有可转换的指令。粘贴 particleex 开头的 Java 指令（一行一条）','info');
  }
}

// ---------- 执行排期文本 ----------
function updateSeqText(){
  if(!entries.length)return;
  var lines=['—— 命令方块执行排期（共 '+entries.length+' 条，总时长约 '+(totalTicks/TPS).toFixed(1)+' 秒）——'];
  entries.forEach((e,i)=>{
    var trig = e.play.mode==='wait'
      ? (i===0 ? '立即执行（延迟 '+e.play.delay+' tick）' : '等上一个效果播完后 +'+e.play.delay+' tick')
      : (e.play.mode==='delay' ? '上一个开始后延迟 '+e.play.delay+' tick' : '与上一条同时执行');
    lines.push('第'+(i+1)+'条 ['+trig+'，展示 '+e.showTicks+' tick，起始 tick '+e.startTick+']：');
    lines.push(e.result.cmd);
  });
  lines.push('');
  lines.push('用法：每条指令放进一个命令方块（建议用循环命令方块 + 计分板计时），');
  lines.push('命令方块的延迟按上面标注的「起始 tick」设置即可——即等前面所有效果展示完再触发下一条。');
  entries._seqText=lines.join('\n');
}
function seqText(){
  if (entries._seqText) return entries._seqText;
  updateSeqText(); return entries._seqText||'';
}

// ---------- UI 绑定 ----------
let autoTimer=null;
function autoRun(){ clearTimeout(autoTimer); autoTimer=setTimeout(()=>doConvert(true),600); }
document.getElementById('cmd').addEventListener('input',autoRun);
document.getElementById('btnRun').onclick=()=>{clearTimeout(autoTimer);doConvert(false);};
document.getElementById('btnCopySeq').onclick=()=>{
  if(!entries.length){toast('还没有转换结果');return;}
  copyText(seqText(),'排期已复制！');
};
document.getElementById('btnPlay').onclick=()=>{
  if(playing)stopPlayback(); else startPlayback();
};
resize();
requestAnimationFrame(loop);
</script>
